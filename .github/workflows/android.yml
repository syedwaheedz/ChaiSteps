name: Build, test & release

# Pull requests and pushes: unit + UI tests, lint, signed release APK attached to the run.
# Pushes to main (e.g. merging a pull request): the same, then a GitHub Release with the APK.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          VERSION="$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')"
          # versionCode must keep increasing so Android installs new builds as updates.
          BUILD=$((100 + ${{ github.run_number }}))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Release keystore
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: this run's APK is signed with a temporary debug key (test builds only) and no GitHub Release is published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit and UI tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintRelease

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -PversionCode=${{ steps.version.outputs.build }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ChaiSteps-${{ steps.version.outputs.version }}.apk"
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ChaiSteps-${{ steps.version.outputs.version }}-build${{ steps.version.outputs.build }}
          path: dist/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-reports
          path: |
            app/build/screenshots/**
            app/build/reports/**

  release:
    needs: build
    # Only publish releases signed with the real key, so every release can update the previous one.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ChaiSteps-${{ needs.build.outputs.version }}-build${{ needs.build.outputs.build }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          {
            echo "## Chai & Steps $VERSION (build $BUILD)"
            echo
            echo "Download \`ChaiSteps-$VERSION.apk\` on your Android phone (Android 8.0+) and open it to install."
            echo "All unit and UI tests and lint passed for this build. Checksums: \`SHA256SUMS.txt\`."
          } > notes.md
          gh release create "v$VERSION-build$BUILD" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Chai & Steps $VERSION (build $BUILD)" --notes-file notes.md --latest
